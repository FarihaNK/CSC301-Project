[project]
name = "medassist"
version = "0.1.0"
description = "Dependencies for RAG solution for medAssist app"
authors = [
    { name = "skip" }
]
readme = "README.md"
requires-python = ">=3.9,<4.0"

# ----
# Poetry uses PEP 621 for listing dependencies in the 'dependencies' table. 
# This is one valid way to define them inline.
# ----
dependencies = [
    "langchain",         # For core LangChain functionality
    "chromadb",          # If you plan to use Chroma vector store
    "langchain-ollama",  # If you need Ollama LLM integration
    "python-docx",       # For importing docx
    "python-pptx",       # For pptx slides
    "pandas",            # For DataFrame usage
    "transformers",      # For Hugging Face model/tokenizer usage
    "torch",              # For PyTorch
    #"langchain-community"
    # If 'langchain_community', 'langchain_text_splitters', 
    # 'langchain_chroma' exist on PyPI or Git, add them here.
    # e.g. "langchain_community" = {git = "https://github.com/xyz/langchain_community.git"}
    #"langchain-chroma (>=0.2.1,<0.3.0)"
    #"langchain-community (>=0.3.16,<0.4.0)"
    "langchain-chroma (>=0.2.1,<0.3.0)",
    "langchain-community (>=0.3.16,<0.4.0)",
    "pypdf (>=5.2.0,<6.0.0)",
    "ollama (>=0.4.7,<0.5.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
